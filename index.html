<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A7F7B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Phòng">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<script src="config.js?v=202611280940"></script><title>Sổ Phòng</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Bố cục: sổ lễ tân — thanh trên (nhà đang chọn + người dùng), dải tab, vùng làm việc; trên điện thoại tab dính đáy màn hình */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --surface-2:#EDF1F2; --line:#DCE3E5; --ink:#27373D; --muted:#6A7B80;
  --accent:#3A7F7B; --accent-ink:#FFFFFF; --accent-soft:#E0EFED; --brass:#9C7A3C;
  --st-booked:#3F6DB5; --st-booked-bg:#CCDBF2; --st-in:#3B8A5C; --st-in-bg:#C8E6D3;
  --st-out:#7D8A8F; --st-out-bg:#DCE2E4; --st-late:#B9463F; --st-late-bg:#F2CCC8;
  --st-noshow:#AA6D2F; --st-noshow-bg:#EFD9BF; --st-block:#66737A; --st-block-bg:#D3D9DC;
  --hk-sach:#4A8C66; --hk-ban:#BE5B54; --hk-dangdon:#B08A3E; --hk-chokiem:#8069B0; --hk-baotri:#77848A;
  --overlay:rgba(20,32,36,.38); --on-st:#FFFFFF; --out-bar:#CDD4D7; --on-out:#4A5A60;
  --shadow:0 1px 2px rgba(19,36,42,.06),0 6px 18px rgba(19,36,42,.07);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Space Grotesk","Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D2629; --surface:#242F33; --surface-2:#2B373B; --line:#38464B; --ink:#D3DCDE; --muted:#93A2A6;
    --accent:#7AB3AE; --accent-ink:#152422; --accent-soft:#2C403F; --brass:#CDAE73;
    --st-booked:#9DB8E6; --st-booked-bg:#3D5A88; --st-in:#97D0AC; --st-in-bg:#3B6A50;
    --st-out:#AEB8BB; --st-out-bg:#46535A; --st-late:#F0A49D; --st-late-bg:#844A47;
    --st-noshow:#E6BD8E; --st-noshow-bg:#735A38; --st-block:#B4BEC1; --st-block-bg:#4A565B;
    --hk-sach:#8DBC9F; --hk-ban:#DB958F; --hk-dangdon:#D4B577; --hk-chokiem:#B3A5D6; --hk-baotri:#A3AEB1;
    --overlay:rgba(0,0,0,.5); --on-st:#14201F; --out-bar:#3F4B50; --on-out:#B5C0C3; --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D2629; --surface:#242F33; --surface-2:#2B373B; --line:#38464B; --ink:#D3DCDE; --muted:#93A2A6;
  --accent:#7AB3AE; --accent-ink:#152422; --accent-soft:#2C403F; --brass:#CDAE73;
  --st-booked:#9DB8E6; --st-booked-bg:#3D5A88; --st-in:#97D0AC; --st-in-bg:#3B6A50;
  --st-out:#AEB8BB; --st-out-bg:#46535A; --st-late:#F0A49D; --st-late-bg:#844A47;
  --st-noshow:#E6BD8E; --st-noshow-bg:#735A38; --st-block:#B4BEC1; --st-block-bg:#4A565B;
  --hk-sach:#8DBC9F; --hk-ban:#DB958F; --hk-dangdon:#D4B577; --hk-chokiem:#B3A5D6; --hk-baotri:#A3AEB1;
  --overlay:rgba(0,0,0,.5); --on-st:#14201F; --out-bar:#3F4B50; --on-out:#B5C0C3; --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
.num,time,.t{font-variant-numeric:tabular-nums}
.app{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
@media (max-width:720px){.app{padding-block:8px 104px}}
.muted{color:var(--muted)} .small{font-size:12px} .grow{flex:1 1 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.hidden{display:none!important}

/* thanh trên */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:4px 10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:20px}
.brand svg{color:var(--accent)}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.who-name{line-height:1.15} .who-name small{display:block;color:var(--muted);font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.who-name small{display:none}.top{gap:8px}}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;min-width:0}
textarea{min-height:70px;resize:vertical;width:100%}
input[type=checkbox],input[type=radio]{min-height:0;width:18px;height:18px;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-size:14px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--st-late)}
.btn.danger.solid{background:var(--st-late);border-color:var(--st-late);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.big{min-height:46px;padding:8px 16px;font-size:15px;font-weight:600}
.btn.sm{min-height:30px;padding:3px 9px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.banner b{color:var(--brass)}

/* tab */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:7px;background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;margin:0;justify-content:space-around;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 6px;border:0;border-radius:8px;min-width:58px}
  .tab[aria-current="page"]{background:var(--accent-soft)}
}

/* thẻ, ô số */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.sec-head:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:default}
.tile b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.warn b{color:var(--st-late)}
.tile.go{cursor:pointer} .tile.go:hover{border-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .when{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:52px;font-variant-numeric:tabular-nums}
.li .main{flex:1;min-width:0}
.li .main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.click{cursor:pointer} .li.click:hover{background:var(--surface-2)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.hk-sach{color:var(--hk-sach)} .hk-ban{color:var(--hk-ban)} .hk-dangdon{color:var(--hk-dangdon)} .hk-chokiem{color:var(--hk-chokiem)} .hk-baotri{color:var(--hk-baotri)}
.pill.hk-sach{background:color-mix(in srgb,var(--hk-sach) 14%,transparent)}
.pill.hk-ban{background:color-mix(in srgb,var(--hk-ban) 14%,transparent)}
.pill.hk-dangdon{background:color-mix(in srgb,var(--hk-dangdon) 16%,transparent)}
.pill.hk-chokiem{background:color-mix(in srgb,var(--hk-chokiem) 14%,transparent)}
.pill.hk-baotri{background:color-mix(in srgb,var(--hk-baotri) 16%,transparent)}
.pill.st-booked{color:var(--st-booked);background:var(--st-booked-bg)}
.pill.st-in{color:var(--st-in);background:var(--st-in-bg)}
.pill.st-out{color:var(--st-out);background:var(--st-out-bg)}
.pill.st-late{color:var(--st-late);background:var(--st-late-bg)}
.pill.st-noshow{color:var(--st-noshow);background:var(--st-noshow-bg)}
.pill.st-cancel{color:var(--st-out);background:var(--st-out-bg)}
.pill.st-block{color:var(--st-block);background:var(--st-block-bg)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.house{background:var(--accent-soft);color:var(--accent)}
.rtag{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 6px;border-radius:7px;background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:15px}
.red{color:var(--st-late)} .late-text{color:var(--st-late);font-weight:600}

/* lịch */
.cal-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cal-tools .range{font-family:var(--f-display);font-weight:700;font-size:16px;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;min-height:34px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend{color:var(--ink)}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.cal-scroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:var(--surface);overscroll-behavior:contain}
.cal-inner{position:relative}
.cal-head{position:sticky;top:0;z-index:6;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-corner{position:sticky;left:0;z-index:7;flex:0 0 var(--namew);background:var(--surface);border-right:1px solid var(--line);padding:6px 8px;font-size:11px;color:var(--muted)}
.cal-day{flex:0 0 auto;text-align:center;padding:5px 0;font-size:12px;color:var(--muted);border-left:1px solid var(--line);line-height:1.2;overflow:hidden;white-space:nowrap}
.cal-day b{display:block;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.cal-day.today{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--ink);font-weight:600} .cal-day.today b{color:var(--ink)}
.cal-day.wkend b{color:var(--brass)}
.cal-group{position:sticky;left:0;display:inline-block;padding:8px 10px 4px;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--accent)}
.cal-grouprow{border-top:1px solid var(--line);background:var(--surface-2)}
.cal-row{display:flex;height:var(--rowh);border-top:1px solid var(--line)}
.cal-subrow{display:flex;align-items:center;height:28px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.cal-sub,.list-sub{position:sticky;left:0;padding:0 10px;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.list-sub{display:block;padding:12px 4px 4px;border-top:1px solid var(--line)}
.list-sub:first-child{border-top:0;padding-top:0}
.cal-name{position:sticky;left:0;z-index:5;flex:0 0 var(--namew);display:flex;align-items:center;gap:7px;padding:0 8px;background:var(--surface);border-right:1px solid var(--line);min-width:0}
.cal-name b{font-family:var(--f-display);font-size:15px}
.cal-name.can-new{cursor:pointer} .cal-name.can-new:hover{background:var(--surface-2)}
.cal-name .plus{font-style:normal;font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--accent);margin-left:4px;opacity:.8}
.cal-name small{display:block;color:var(--muted);font-size:10.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:currentColor}
.track{position:relative;flex:0 0 auto;cursor:cell}
.today-col{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 8%,transparent);pointer-events:none;z-index:0}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--st-late);opacity:.85;z-index:4;pointer-events:none}
.now-line::before{content:attr(data-t);position:absolute;top:2px;left:1px;transform:translateX(-50%);background:var(--st-late);color:var(--surface);font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px}
.bar{position:absolute;top:6px;height:calc(var(--rowh) - 12px);border-radius:6px;padding:0 7px;display:flex;align-items:center;font-size:12px;font-weight:600;overflow:hidden;cursor:pointer;z-index:2;user-select:none;-webkit-user-select:none;color:var(--on-st)}
.bar .bar-t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.bar .bar-t small{color:inherit;font-weight:400;opacity:.88}
.bar:hover{box-shadow:var(--shadow);filter:brightness(1.06)}
.bar.st-booked{background:var(--st-booked)}
.bar.st-in{background:var(--st-in)}
.bar.st-out{background:var(--out-bar);color:var(--on-out);font-weight:500}
.bar.st-late{background:var(--st-late);animation:blink 2.6s ease-in-out infinite}
.bar.st-noshow{background:var(--st-noshow)}
.bar.st-cancel{background:transparent;border:1px dashed var(--st-out);color:var(--muted);text-decoration:line-through}
.bar.st-block{background:repeating-linear-gradient(-45deg,var(--st-block) 0 7px,color-mix(in srgb,var(--st-block) 80%,var(--surface)) 7px 12px)}
.bar.dim{opacity:.25} .bar.hit{outline:2px solid var(--brass)}
.bar.dragging{opacity:.85;pointer-events:none;z-index:9;box-shadow:var(--shadow)}
.bar-grip{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize}
.bar-grip::after{content:"";position:absolute;right:3px;top:30%;bottom:30%;width:2px;border-radius:2px;background:currentColor;opacity:.35}
@keyframes blink{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion: reduce){.bar.st-late{animation:none}}
.daylist .li{align-items:flex-start}
/* mật khẩu cửa */
.code-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.code-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.code-row:first-child{border-top:0}
.code-row.editing{background:var(--surface-2)}
.code-main{flex:1 1 140px;min-width:0} .code-main b{display:block} .code-main small{color:var(--muted);font-size:12px}
.code-cur{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.code-cur small{font-size:11px;color:var(--muted)}
.code{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.btn.warn-btn{color:var(--st-late);border-color:color-mix(in srgb,var(--st-late) 45%,var(--line))}
/* khung chọn ngày giờ nhận → trả */
.rangebtn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:44px;cursor:pointer;font-size:14px;color:var(--ink)}
.rangebtn:hover{border-color:var(--accent)} .rangebtn:disabled{opacity:.6;cursor:default}
.rp{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.rp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-size:15px}
.rp-hint{font-size:12px;color:var(--muted);margin-bottom:6px;text-align:center}
.rp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 0;text-align:center}
.rp-wd{font-size:11px;color:var(--muted);padding:4px 0}
.rp-day{border:0;background:none;min-height:40px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.rp-day:hover{background:var(--surface)}
.rp-day.in{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.rp-day.start,.rp-day.end{background:var(--accent);color:var(--accent-ink);font-weight:700}
.rp-day.start{border-radius:10px 0 0 10px} .rp-day.end{border-radius:0 10px 10px 0} .rp-day.start.end{border-radius:10px}
.rp-day.today:not(.start):not(.end){box-shadow:inset 0 0 0 1px var(--accent);border-radius:10px}
.rp-day.past{opacity:.45}
.rp-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
/* huy hiệu nguồn đặt (logo kênh) */
.src{display:inline-grid;place-items:center;flex:0 0 auto;width:20px;height:20px;border-radius:6px;color:#fff;font:800 11px/1 var(--f-body);letter-spacing:-.02em;vertical-align:-5px}
.src svg{width:13px;height:13px}
.src.sm{width:16px;height:16px;font-size:9px;border-radius:5px;vertical-align:-3px} .src.sm svg{width:10px;height:10px}

function call(action, payload, opts = {}){
  // "Hiện ngay": sửa dữ liệu trên máy và đóng hộp thoại trước, máy chủ lưu phía sau.
  // Nếu máy chủ báo lỗi thì hiện thông báo và tải lại dữ liệu thật.
  if (opts.apply){ try { opts.apply(); } catch (e) {} opts.optimistic = true; if (!opts.keepOpen) closeModal(); render(); }
  pending++; busy = true; document.body.classList.add('busy');
  const btns = [...document.querySelectorAll('#modal button[type=submit]')]; btns.forEach(b => b.disabled = true);
  const p = queue.then(async () => {
    const r = await rpc(action, payload);
    pending--; if (!pending){ busy = false; document.body.classList.remove('busy'); }
    btns.forEach(b => b.disabled = false);
    if (r.auth){ signOut(r.err); return false; }
    if (r.err){ if (!opts.optimistic && opts.err && $('#' + opts.err)) errBox(opts.err, esc(r.err)); else { toast('Chưa lưu được: ' + r.err, true); if (opts.optimistic) reload(); } return false; }
    // Hộp thoại người dùng vừa mở trong lúc chờ lưu thì giữ nguyên, không đóng giùm.
    if (!opts.optimistic) closeModal();
    if (!pending){ applyData(r.data); if (!drag && !$('#modal').childElementCount) render(); }
    if (r.msg && !opts.optimistic) toast(r.msg);
    if (opts.after) opts.after(r);
    return r;
  });
  queue = p.catch(() => {});
  return p;
}
async function signIn(action, payload, errId){
  if (busy) return; busy = true; document.body.classList.add('busy');
  const r = await rpc(action, payload);
  busy = false; document.body.classList.remove('busy');
  if (r.err) return errBox(errId, esc(r.err));
  TOKEN = r.token; saveTok(); applyData(r.data); BOOT.needsSetup = false;
  ui.view = action === 'setup' ? 'settings' : 'today'; ui.house = 'all'; ui.scrollNow = true; render();
  if (action === 'setup') toast('Đã tạo tài khoản Chủ. Olie Home đã có sẵn, hãy kiểm tra giờ và giá trong Cài đặt.');
}

const autoOutOn = () => !S || !S.settings || S.settings.autoOut !== false;
const overdue = b => b.status === 'inhouse' && Date.now() > b.co && !autoOutOn();
function span(b){ const now = Date.now(); const s = b.aci || b.ci; let e = b.co; if (b.status === 'checkedout') e = b.aco || b.co; else if (b.status === 'inhouse' && now > b.co && !autoOutOn()) e = now; return [s, e]; }
function conflicts(c){ const [s, e] = span(c); return S.bookings.filter(o => o.id !== c.id && o.roomId === c.roomId && isActive(o)).filter(o => { const [os, oe] = span(o); return s < oe && os < e; }); }
function stCls(b){ if (b.kind === 'khoa') return 'st-block'; if (b.status === 'cancelled') return 'st-cancel'; if (b.status === 'noshow') return 'st-noshow'; if (b.status === 'checkedout') return 'st-out'; if (overdue(b)) return 'st-late'; if (b.status === 'inhouse') return 'st-in'; return 'st-booked'; }
function stName(b){ if (b.kind === 'khoa') return 'Khóa phòng'; return { booked:'Đã đặt', inhouse: overdue(b) ? 'Quá giờ trả' : 'Đang ở', checkedout:'Đã trả phòng', cancelled:'Đã hủy', noshow:'Không đến' }[b.status]; }
function priceFor(h, r, kind, ci, co){
  const t = typeOf(h, r); if (!t || !(co > ci)) return 0;
  if (kind === 'gio'){
    const hrs = Math.max(1, Math.ceil((co - ci) / HOUR - 0.001));
    const p = hrs <= 2 ? t.h2 : hrs === 3 ? t.h3 : t.h3 + (hrs - 3) * t.hourNext;
    return t.night ? Math.min(p, t.night) : p;
  }
  if (kind === 'quadem') return t.overnight;
  return Math.max(1, Math.round((sod(co) - sod(ci)) / DAY)) * t.night;
}
const paidOf = b => (b.deposit || 0) + (b.payments || []).reduce((s, p) => s + p.amt, 0);

  <nav class="tabs">${tabs.map(t => `<button class="tab" data-act="view" data-v="${t.k}"${ui.view === t.k ? ' aria-current="page"' : ''}>${ICON[t.k]}<span>${t.n}</span></button>`).join('')}</nav>

  }
  saveUI();
}

/* ====== HÔM NAY ====== */
function vToday(){
  const hs = housesWith('datphong'), ids = new Set(hs.map(h => h.id)), now = Date.now(), E = sod(now) + DAY;
  const bs = S.bookings.filter(b => ids.has(b.houseId));
  const inhouse = bs.filter(b => b.status === 'inhouse');
  const arrivals = bs.filter(b => b.status === 'booked' && b.ci < E).sort((a, b) => a.ci - b.ci);
  const departures = inhouse.filter(b => b.co < E && !overdue(b) && (b.co > now || !autoOutOn())).sort((a, b) => a.co - b.co);
  const over = inhouse.filter(overdue).sort((a, b) => a.co - b.co);
  const blocks = bs.filter(b => b.kind === 'khoa' && b.status === 'block' && b.ci <= now && b.co > now);
  const rooms = hs.flatMap(h => h.rooms.map(r => ({ h, r })));
  const free = rooms.filter(({ r }) => !inhouse.some(b => b.roomId === r.id) && !blocks.some(b => b.roomId === r.id) && r.hk !== 'baotri');
  const hkH = hs.filter(h => can(h.id, 'donphong'));
  const dirty = hkItems(hkH).filter(i => i.cat <= 2);
  const multi = hs.length > 1;
  const roomCell = b => { const h = H(b.houseId), r = RM(h, b.roomId); return `<span class="rtag">${esc(r ? r.name : '?')}</span>`; };
  const hc = b => multi ? `<span class="chip house">${esc(hName(b.houseId))}</span> ` : '';
  const arrRow = b => { const h = H(b.houseId), r = RM(h, b.roomId), late = b.ci < now; return `<div class="li click" data-act="openBk" data-id="${b.id}">
      <div class="when">${fT(b.ci)}</div>${roomCell(b)}
      <div class="main"><b>${esc(guestName(b))}</b><span class="small muted">${hc(b)}${srcBadge(b.source, 'sm')} ${esc(b.source)} · ${BKIND[b.kind]}${late ? ` · <span class="late-text">trễ ${dur(now - b.ci)}</span>` : ''}${r && r.hk !== 'sach' ? ` · <span class="${'hk-' + r.hk}">phòng ${HK[r.hk].toLowerCase()}</span>` : ''}</span></div>
      ${can(b.houseId, 'datphong', 'sua') ? `<button class="btn sm ${b.infoSent ? '' : 'warn-btn'}" data-act="sendInfo" data-id="${b.id}" title="${b.infoSent ? 'Đã gửi lúc ' + fDT(b.infoSent) : 'Chưa gửi thông tin nhận phòng'}">${b.infoSent ? 'Đã gửi tin' : 'Gửi tin'}</button><button class="btn sm primary" data-act="checkin" data-id="${b.id}">Nhận phòng</button>` : ''}</div>`; };
  const depRow = (b, isOver) => `<div class="li click" data-act="openBk" data-id="${b.id}">
      <div class="when ${isOver ? 'red' : ''}">${fT(b.co)}</div>${roomCell(b)}
      <div class="main"><b>${esc(guestName(b))}</b><span class="small muted">${hc(b)}${BKIND[b.kind]} · ${isOver ? `<span class="late-text">quá giờ ${dur(now - b.co)}</span>` : 'còn ' + dur(b.co - now)}</span></div>
      ${can(b.houseId, 'datphong', 'sua') ? `<button class="btn sm" data-act="extend" data-id="${b.id}">Gia hạn</button><button class="btn sm" data-act="checkout" data-id="${b.id}">Trả phòng</button>` : ''}</div>`;
  const sum = multi ? `<div class="sec-head"><h2>Theo từng nhà</h2></div><div class="tbl-wrap"><table><thead><tr><th>Nhà</th><th class="c">Phòng trống</th><th class="c">Đang có khách</th><th class="c">Khách đến</th><th class="c">Khách trả</th><th class="c">Quá giờ trả</th><th class="c">Cần dọn</th></tr></thead><tbody>${hs.map(h => {
      const f = x => x.filter(b => b.houseId === h.id).length;
      return `<tr><td><b>${esc(h.name)}</b></td><td class="c num">${free.filter(x => x.h.id === h.id).length}/${h.rooms.length}</td><td class="c num">${f(inhouse)}</td><td class="c num">${f(arrivals)}</td><td class="c num">${f(departures)}</td><td class="c num ${f(over) ? 'red' : ''}">${f(over)}</td><td class="c num">${dirty.filter(i => i.h.id === h.id).length}</td></tr>`; }).join('')}</tbody></table></div>` : '';
  if (!hs.length) return `<div class="empty">Chưa có nhà nào. Vào mục “Nhà & phòng” để thêm nhà đầu tiên.</div>`;
  return `
  <div class="sec-head"><h2>Hôm nay, ${WD[new Date(now).getDay()]} ${fDY(now)}</h2><span class="muted small">cập nhật lúc ${fT(now)} · tự làm mới mỗi 30 giây</span><span class="grow"></span>

  <div class="cols">
    <div class="card"><div class="sec-head" style="margin-top:0"><h3>Khách sắp đến</h3><span class="muted small">xếp theo giờ nhận</span></div>
      <div class="list">${arrivals.map(arrRow).join('') || '<div class="empty">Hôm nay không còn khách đến.</div>'}</div></div>
    <div class="card"><div class="sec-head" style="margin-top:0"><h3>Khách sắp trả phòng</h3><span class="muted small">xếp theo giờ trả</span></div>
      <div class="list">${departures.map(b => depRow(b, false)).join('') || '<div class="empty">Hôm nay không còn khách trả phòng.</div>'}</div></div>
  </div>
  ${sum}`;
}

/* ====== LỊCH ====== */
const DAYW = { 1:1152, 3:240, 7:132, 14:80, 30:46 };
let NAMEW = 104; const ROWH = 46;
const isPhone = () => window.innerWidth < 720;
/*
 * Chế độ toàn màn hình: ô to dễ nhìn, lịch dài 35 ngày (7 ngày trước → 4 tuần sau).
 * Kéo ngang để xem các ngày khác, kéo dọc để xem các phòng. Nút − / + đổi độ to của ô.
 */
const FULL_DAYS = 35, FULL_ZOOM = [90, 130, 180], FULL_ROWH = 60;
const fullStart = () => ui.fullStart || (sod(Date.now()) - 7*DAY);
const calStartNow = () => ui.calFull ? fullStart() : ui.calStart;
const calDaysNow = () => ui.calFull ? FULL_DAYS : ui.calDays;
function dayWidth(days){
  if (!ui.calFull) return DAYW[days] || 132;
  return FULL_ZOOM[ui.calZoom === undefined ? 1 : ui.calZoom] || 130;
}
function vCal(){
  const hs = housesWith('lich'); if (!hs.length) return vNone();
  NAMEW = ui.calFull && isPhone() ? 72 : 104;
  if (ui.calFull && ui.calMode === 'list') ui.calMode = 'grid';
  const days = calDaysNow(), start = calStartNow(), end = start + days*DAY;
  const canAdd = hs.some(h => can(h.id, 'datphong', 'them'));
  const canBlock = hs.some(h => can(h.id, 'lich', 'them'));
  const floors = [...new Set(hs.flatMap(h => h.rooms.map(r => r.floor)))].sort((a, b) => a - b);
  const rangeLbl = days === 1 ? `${WD[new Date(start).getDay()]} ${fDY(start)}` : `${fD(start)} – ${fDY(end - DAY)}`;
  const tools = ui.calFull ? `<div class="cal-tools">
    <div class="seg"><button data-act="fullMove" data-d="-1" aria-label="Lùi 2 tuần">‹</button><button data-act="fullToday">Hôm nay</button><button data-act="fullMove" data-d="1" aria-label="Tới 2 tuần">›</button></div>
    <div class="seg"><button data-act="fullZoom" data-d="-1" aria-label="Thu nhỏ" ${(ui.calZoom ?? 1) <= 0 ? 'disabled' : ''}>−</button><button data-act="fullZoom" data-d="1" aria-label="Phóng to" ${(ui.calZoom ?? 1) >= FULL_ZOOM.length - 1 ? 'disabled' : ''}>+</button></div>
    <span class="grow"></span>
    ${canAdd ? '<button class="btn primary sm" data-act="newBk" aria-label="Đặt phòng">+ Đặt</button>' : ''}
    <button class="btn sm" data-act="calFull" aria-label="Thoát toàn màn hình">✕</button>
  </div>` : `<div class="cal-tools">
    <div class="seg"><button data-act="calMove" data-d="-1" aria-label="Lùi">‹</button><button data-act="calToday">Hôm nay</button><button data-act="calMove" data-d="1" aria-label="Tới">›</button></div>
    <span class="range">${rangeLbl}</span>
    <div class="seg">${[1,3,7,14,30].map(d => `<button data-act="calDays" data-d="${d}" class="${days === d ? 'on' : ''}">${d === 1 ? '1 ngày' : d + ' ngày'}</button>`).join('')}</div>
    <button class="btn" data-act="calFull">Toàn màn hình</button>
    <div class="seg"><button data-act="calMode" data-m="grid" class="${ui.calMode === 'grid' ? 'on' : ''}">Lưới</button><button data-act="calMode" data-m="list" class="${ui.calMode === 'list' ? 'on' : ''}">Danh sách</button></div>
    <input id="calQ" data-inp="calQ" placeholder="Tìm tên, SĐT, mã đặt" value="${esc(ui.q)}" style="width:190px" aria-label="Tìm lượt đặt">
    <select data-chg="floor" aria-label="Lọc tầng"><option value="">Mọi tầng</option>${floors.map(f => `<option value="${f}"${String(ui.floor) === String(f) ? ' selected' : ''}>Tầng ${f}</option>`).join('')}</select>
    <label class="row small muted" style="gap:5px"><input type="checkbox" data-chg="showCancel" ${ui.showCancel ? 'checked' : ''}>Hiện lượt đã hủy</label>
    <span class="grow"></span>
    ${canBlock ? '<button class="btn" data-act="newBlock">Khóa phòng</button>' : ''}
    ${canAdd ? '<button class="btn primary" data-act="newBk">+ Đặt phòng</button>' : ''}
  </div>
  <div class="legend"><span><i style="background:var(--st-booked)"></i>Đã đặt</span><span><i style="background:var(--st-in)"></i>Đang ở</span><span><i style="background:var(--st-late)"></i>Quá giờ trả</span><span><i style="background:var(--out-bar)"></i>Đã trả</span><span><i style="background:var(--st-noshow)"></i>Không đến</span><span><i style="background:repeating-linear-gradient(-45deg,var(--st-block) 0 4px,color-mix(in srgb,var(--st-block) 80%,var(--surface)) 4px 7px)"></i>Khóa phòng</span>
   <span>·</span>${Object.entries(HK).filter(([k]) => k === 'sach' || k === 'ban' || k === 'baotri').map(([k, v]) => `<span class="hk-${k}"><span class="dot" style="display:inline-block;margin-right:4px"></span><span class="muted">${v}</span></span>`).join('')}
   <span class="muted">· Kéo thả thanh để đổi phòng hoặc ngày, kéo mép phải để gia hạn (trên máy tính)</span></div>`;
  if (ui.calMode === 'list') return tools + vCalList(hs);
  const dayW = dayWidth(days), pph = dayW / 24, W = days * dayW, now = Date.now(), T = sod(now);
  let head = `<div class="cal-head"><div class="cal-corner">Phòng</div>`;
  if (days === 1){ for (let h = 0; h < 24; h++) head += `<div class="cal-day" style="width:${pph}px"><b>${pad(h)}h</b></div>`; }
  else for (let i = 0; i < days; i++){ const d = start + i*DAY, wd = new Date(d).getDay(); head += `<div class="cal-day ${d === T ? 'today' : ''} ${wd === 0 || wd === 6 ? 'wkend' : ''}" style="width:${dayW}px">${WD[wd]}<b>${days === 30 ? new Date(d).getDate() : fD(d)}</b></div>`; }
  head += '</div>';
  const q = ui.q.trim().toLowerCase();
  const bg = days === 1 ? `background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:${pph}px 100%` : `background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:${dayW}px 100%`;
  let rows = '';
  for (const h of hs){
    const rooms = h.rooms.filter(r => ui.floor === '' || String(r.floor) === String(ui.floor));
    if (!rooms.length) continue;
    if (hs.length > 1) rows += `<div class="cal-grouprow" style="width:${NAMEW + W}px"><span class="cal-group">${esc(h.name)}</span></div>`;
    const dragOK = can(h.id, 'lich', 'sua');
    for (const r of groupRooms(h, rooms)){
      if (r.sub){ rows += `<div class="cal-subrow" style="width:${NAMEW + W}px"><span class="cal-sub">${esc(r.sub)} · ${r.n} phòng</span></div>`; continue; }
      const bars = S.bookings.filter(b => b.roomId === r.id && (ui.showCancel || b.status !== 'cancelled')).map(b => {
        const [s, e] = span(b); if (e <= start || s >= end) return '';
        const left = Math.max(0, (s - start) / HOUR * pph), right = Math.min(W, (e - start) / HOUR * pph), w = Math.max(6, right - left);
        const nm = b.kind === 'khoa' ? 'Khóa · ' + (b.note || 'bảo trì') : guestName(b);
        const tt = b.kind === 'khoa' ? '' : ` <small>${fT(b.aci || b.ci)}→${fT(b.status === 'checkedout' ? b.aco : b.co)}</small>`;
        const hay = (b.guest.name + ' ' + b.guest.phone + ' ' + b.otaCode).toLowerCase();
        const qc = q ? (can(b.houseId, 'khach') && hay.includes(q) ? ' hit' : ' dim') : '';
        const draggable = dragOK && (b.status === 'booked' || b.status === 'inhouse' || b.status === 'block');
        const title = `${nm} · ${stName(b)} · ${fT(b.aci || b.ci)} ${fD(b.aci || b.ci)} → ${fT(b.status === 'checkedout' ? b.aco : b.co)} ${fD(b.status === 'checkedout' ? b.aco : b.co)}`;
        return `<div class="bar ${stCls(b)}${qc}" data-act="openBk" data-id="${b.id}" ${draggable ? 'data-drag="1"' : ''} style="left:${left}px;width:${w}px" title="${esc(title)}">${b.kind === 'khoa' ? '' : srcBadge(b.source, 'sm')}<span class="bar-t">${esc(nm)}${tt}</span>${draggable ? '<i class="bar-grip"></i>' : ''}</div>`;
      }).join('');
      const t = typeOf(h, r);
      const canNew = can(h.id, 'datphong', 'them');
      rows += `<div class="cal-row"><div class="cal-name${canNew ? ' can-new' : ''}" ${canNew ? `data-act="newBk" data-house="${h.id}" data-room="${r.id}" title="Bấm để đặt phòng ${esc(r.name)}"` : ''}><span class="dot hk-${r.hk}" title="${HK[r.hk]}"></span><div style="min-width:0"><b>${esc(r.name)}${canNew ? '<i class="plus">+</i>' : ''}</b><small>${esc(t ? t.name : '')} · T${r.floor}</small></div></div><div class="track" data-act="calNew" data-house="${h.id}" data-room="${r.id}" style="width:${W}px;${bg}">${bars}</div></div>`;
    }
  }
  const todayCol = days > 1 && T >= start && T < end ? `<div class="today-col" style="left:${NAMEW + (T - start) / HOUR * pph}px;width:${dayW}px"></div>` : '';
  const nowLine = now >= start && now < end ? `<div class="now-line" data-t="${fT(now)}" style="left:${NAMEW + (now - start) / HOUR * pph}px"></div>` : '';
  const grid = `<div class="cal-scroll" style="--namew:${NAMEW}px;--rowh:${ui.calFull ? FULL_ROWH : ROWH}px"><div class="cal-inner" style="width:${NAMEW + W}px">${head}<div style="position:relative">${todayCol}${nowLine}${rows || '<div class="empty" style="margin:12px">Không có phòng nào khớp bộ lọc.</div>'}</div></div></div>`;
  return ui.calFull ? `<div class="calfull">${tools}${grid}</div>` : tools + grid;
}
const roomCmp = (a, b) => a.floor - b.floor || a.name.localeCompare(b.name, 'vi', { numeric:true });
function groupRooms(h, rooms){
  const out = [], known = new Set(h.types.map(t => t.id));
  for (const t of h.types){ const l = rooms.filter(r => r.typeId === t.id).sort(roomCmp); if (l.length) out.push({ sub: t.name, n: l.length }, ...l); }
  const rest = rooms.filter(r => !known.has(r.typeId)).sort(roomCmp);
  if (rest.length) out.push({ sub:'Khác', n: rest.length }, ...rest);
  return out;
}
function vCalList(hs){
  const d0 = ui.listDay, d1 = d0 + DAY, q = ui.q.trim().toLowerCase();
  let out = `<div class="row" style="margin-bottom:10px"><div class="seg"><button data-act="listMove" data-d="-1">‹</button><button data-act="listToday">Hôm nay</button><button data-act="listMove" data-d="1">›</button></div><b class="range" style="font-family:var(--f-display);font-size:16px">${WD[new Date(d0).getDay()]} ${fDY(d0)}</b></div>`;
  for (const h of hs){
    out += `<div class="card" style="margin-bottom:12px">${hs.length > 1 ? `<h3 style="margin-bottom:6px">${esc(h.name)}</h3>` : ''}<div class="list daylist">`;
    for (const r of groupRooms(h, h.rooms.filter(r => ui.floor === '' || String(r.floor) === String(ui.floor)))){
      if (r.sub){ out += `<div class="list-sub">${esc(r.sub)} · ${r.n} phòng</div>`; continue; }
      const bs = S.bookings.filter(b => b.roomId === r.id && (ui.showCancel || b.status !== 'cancelled')).filter(b => { const [s, e] = span(b); return s < d1 && e > d0; }).filter(b => !q || (can(h.id, 'khach') && (b.guest.name + ' ' + b.guest.phone + ' ' + b.otaCode).toLowerCase().includes(q))).sort((a, b) => span(a)[0] - span(b)[0]);
      out += `<div class="li"><span class="rtag">${esc(r.name)}</span><span class="dot hk-${r.hk}" title="${HK[r.hk]}" style="margin-top:10px"></span><div class="main stack" style="gap:4px">${bs.map(b => { const [s, e] = span(b); return `<div class="row click" data-act="openBk" data-id="${b.id}" style="cursor:pointer;gap:6px"><span class="pill ${stCls(b)}">${stName(b)}</span><b class="t">${fT(s)} ${sod(s) !== d0 ? fD(s) : ''} → ${fT(e)} ${sod(e) !== d0 ? fD(e) : ''}</b><span class="muted">${esc(b.kind === 'khoa' ? b.note : guestName(b))}</span></div>`; }).join('') || '<span class="muted">Trống</span>'}</div>
        ${can(h.id, 'datphong', 'them') ? `<button class="btn sm" data-act="newBk" data-house="${h.id}" data-room="${r.id}" data-day="${d0}">+ Đặt</button>` : ''}</div>`;
    }
    out += `</div></div>`;
  }
  return out;
}

/* ====== DỌN PHÒNG ====== */
const HKG = { 1:'Gấp — có khách nhận phòng hôm nay', 2:'Cần dọn — khách đã trả phòng', 3:'Sắp trả phòng (trong 2 giờ)', 4:'Khách đang ở', 5:'Chờ kiểm tra', 6:'Bảo trì', 7:'Sạch, sẵn sàng' };
function hkItems(hs){
  const now = Date.now(), T = sod(now), E = T + DAY, items = [];
  for (const h of hs) for (const r of h.rooms){
    const rb = S.bookings.filter(b => b.roomId === r.id);
    const inb = rb.find(b => b.status === 'inhouse');
    const lastOut = rb.filter(b => b.status === 'checkedout').sort((a, b) => b.aco - a.aco)[0];
    const next = rb.filter(b => b.status === 'booked' && b.kind !== 'khoa' && b.ci > now - 12*HOUR).sort((a, b) => a.ci - b.ci)[0];
    const arrToday = next && next.ci < E;
    let cat, key = 0;
    if (r.hk === 'baotri') cat = 6;
    else if (inb){
      if (inb.co - now <= S.settings.prepH*HOUR){ cat = 3; key = inb.co; }
      else if (!r.dnd && (r.hk !== 'sach' || (r.hkDoneAt || 0) < T)){ cat = 4; key = inb.co; }
      else cat = 7;
    }
    else if (r.hk === 'ban' || r.hk === 'dangdon' || r.hk === 'chokiem'){ if (arrToday){ cat = 1; key = next.ci; } else { cat = 2; key = lastOut ? lastOut.aco : 0; } }
    else cat = 7;
    const red = next && arrToday && r.hk !== 'sach' && next.ci - now < S.settings.redM*MIN;
    items.push({ h, r, cat, key, inb, lastOut, next, arrToday, red });
  }
  return items.sort((a, b) => a.cat - b.cat || a.key - b.key || a.r.name.localeCompare(b.r.name));
}
function vHK(){
  const hs = housesWith('donphong'); if (!hs.length) return vNone();
  const now = Date.now(), T = sod(now);
  let items = hkItems(hs);
  if (ui.hkMine) items = items.filter(i => i.r.assignee === me.id);
  const multi = hs.length > 1;
  const staff = h => S.users.filter(u => !u.locked && (u.isOwner || (u.perms[h.id] && u.perms[h.id].donphong && u.perms[h.id].donphong.sua)));
  const uname = id => (S.users.find(u => u.id === id) || {}).name || '—';
  const card = it => {
    const { h, r, inb, lastOut, next, red } = it, hid = h.id;
    const canDo = can(hid, 'donphong', 'sua'), canCheck = can(hid, 'kiemtra', 'sua'), canAssign = me.isOwner || can(hid, 'caidat', 'sua');
    const lines = [];
    if (inb){ const od = now > inb.co; lines.push(`<div class="hk-line"><span class="k">Khách đang ở · trả lúc</span><span class="v ${od ? 'red' : ''}">${fDT(inb.co)}</span>${od ? `<span class="late-text">quá ${dur(now - inb.co)}</span>` : it.cat === 3 ? `<span class="countdown">còn ${dur(inb.co - now)}</span>` : ''}</div>`); }
    else if (lastOut && lastOut.aco > T - 12*HOUR) lines.push(`<div class="hk-line"><span class="k">Khách đã trả phòng lúc</span><span class="v">${fDT(lastOut.aco)}</span><span class="muted small">(${dur(now - lastOut.aco)} trước)</span></div>`);
    if (next) lines.push(`<div class="hk-line"><span class="k">Khách mới nhận phòng</span><span class="v">${fDT(next.ci)}</span>${it.arrToday ? `<span class="countdown ${red ? 'red' : ''}">${next.ci > now ? 'còn ' + dur(next.ci - now) : 'đã tới giờ'}</span>` : ''}${can(hid, 'khach') ? `<span class="muted small">${esc(next.guest.name)}</span>` : ''}</div>`);
    if (r.hk === 'sach' && r.hkBy && r.hkDoneAt > now - 12*HOUR) lines.push(`<div class="hk-line"><span class="k">Dọn xong lúc</span><span class="v">${fDT(r.hkDoneAt)}</span><span class="muted small">bởi ${esc(uname(r.hkBy))}</span></div>`);
    if (r.dnd && inb) lines.push(`<div class="hk-line"><span class="chip">Khách không muốn dọn</span></div>`);
    if (r.hkNote) lines.push(`<div class="hk-line"><span class="k">Ghi chú:</span><span>${esc(r.hkNote)}</span></div>`);
    const btn = [];
    if (canDo){
      if (r.hk === 'ban' || r.hk === 'dangdon' || r.hk === 'chokiem' || (it.cat === 4 && r.hk === 'sach')) btn.push(`<button class="btn primary big" data-act="hk" data-op="clean" data-h="${hid}" data-r="${r.id}">Đã dọn xong</button>`);
      if (r.hk === 'baotri') btn.push(`<button class="btn big" data-act="hk" data-op="fixed" data-h="${hid}" data-r="${r.id}">Đã sửa xong</button>`);
      if (r.hk === 'sach' && it.cat === 7 && !inb) btn.push(`<button class="btn sm" data-act="hk" data-op="dirty" data-h="${hid}" data-r="${r.id}">Đánh dấu bẩn</button>`);
    }
    if (canDo && r.hk !== 'baotri') btn.push(`<button class="btn sm" data-act="hk" data-op="broken" data-h="${hid}" data-r="${r.id}">Báo hỏng</button>`);
    if (canDo) btn.push(`<button class="btn sm ghost" data-act="hk" data-op="note" data-h="${hid}" data-r="${r.id}">Ghi chú</button>`);
    if (canDo && inb) btn.push(`<button class="btn sm ghost" data-act="hk" data-op="dnd" data-h="${hid}" data-r="${r.id}">${r.dnd ? 'Bỏ “không dọn”' : 'Khách không muốn dọn'}</button>`);
    const assign = canAssign ? `<label class="row small muted" style="gap:6px">Giao cho <select data-chg="assign" data-h="${hid}" data-r="${r.id}" style="min-height:30px;padding:3px 8px"><option value="">— Chưa giao —</option>${staff(h).map(u => `<option value="${u.id}"${r.assignee === u.id ? ' selected' : ''}>${esc(u.name)}</option>`).join('')}</select></label>` : (r.assignee ? `<span class="small muted">Giao cho: ${esc(uname(r.assignee))}</span>` : '');
    return `<article class="hk-card c${it.cat} ${red ? 'is-red' : ''}">
      <div class="keytag hk-${r.hk}"><span class="hole"></span><b>${esc(r.name)}</b><small>Tầng ${r.floor}</small></div>
      <div class="hk-body">
        <div class="row" style="gap:6px"><span class="pill hk-${r.hk}">${HK[r.hk]}</span>${multi ? `<span class="chip house">${esc(h.name)}</span>` : ''}${it.cat <= 2 ? `<span class="prio p${it.cat}" title="Mức ưu tiên">${it.cat}</span>` : ''}</div>
        ${lines.join('')}
        <div class="hk-actions">${btn.join('')}</div>
        ${assign}
      </div></article>`;
  };
  const groups = [1,2,3,4,5,6,7].map(c => ({ c, list: items.filter(i => i.cat === c) })).filter(g => g.list.length);
  const need = items.filter(i => i.cat <= 2).length;
  return `<div class="sec-head"><h2>Dọn phòng</h2><span class="muted small">${need ? `${need} phòng cần dọn · phòng gấp nhất đứng đầu` : 'Không có phòng nào cần dọn gấp'}</span><span class="grow"></span>
      <button class="btn ${ui.hkMine ? 'on' : ''}" data-act="hkMine">Phòng của tôi</button></div>
    ${groups.map(g => {
      const collapsed = g.c === 7 && !ui.hkShowClean;
      return `<div class="hk-group-title${g.c === 1 ? ' urgent' : ''}">${g.c <= 2 ? `<span class="prio p${g.c}">${g.c}</span>` : ''}${g.c === 3 ? `Sắp trả phòng (trong ${S.settings.prepH} giờ)` : HKG[g.c]}<span class="count">${g.list.length}</span>${g.c === 7 ? `<button class="btn sm ghost" data-act="hkClean">${collapsed ? 'Hiện' : 'Thu gọn'}</button>` : ''}</div>${collapsed ? '' : `<div class="hk-grid">${g.list.map(card).join('')}</div>`}`;
    }).join('') || '<div class="empty">Không có phòng nào được giao cho bạn.</div>'}`;
}

/* ====== NHÀ & PHÒNG ====== */
function vHouses(){
  const hs = me.isOwner ? S.houses.filter(h => !h.archived) : myHouses().filter(h => can(h.id, 'caidat'));
  const archived = me.isOwner ? S.houses.filter(h => h.archived) : [];
  const now = Date.now();
  const card = h => {
    const future = S.bookings.filter(b => b.houseId === h.id && (b.status === 'booked' || b.status === 'inhouse') && b.kind !== 'khoa').length;
    return `<div class="card house-card">
      <div class="row"><h3 class="grow">${esc(h.name)}</h3><span class="chip">${h.rooms.length} phòng</span></div>
      <dl class="kv"><dt>Địa chỉ</dt><dd>${esc(h.address || '—')}</dd><dt>Điện thoại</dt><dd>${esc(h.phone || '—')}</dd><dt>Giờ chuẩn</dt><dd>Nhận ${h.ci} · Trả ${h.co} · Qua đêm ${h.onIn}→${h.onOut}</dd>
      ${can(h.id, 'tien') ? `<dt>Tài khoản</dt><dd>${esc(h.bank.name)} · ${esc(h.bank.acc)} · ${esc(h.bank.holder)}</dd><dt>Loại phòng</dt><dd>${h.types.map(t => `${esc(t.name)}: ${money(t.night)}/đêm, ${money(t.h2)} 2 giờ đầu`).join('<br>')}</dd>` : ''}
      <dt>Đang có</dt><dd>${future} lượt đặt sắp tới hoặc khách đang ở</dd></dl>

/* ====== BÁO CÁO DOANH THU ====== */
function repRange(){
  const T = sod(Date.now()), d = new Date(T), p = ui.repP || 'month';
  if (p === 'today') return [T, T + DAY, 'Hôm nay ' + fDY(T)];
  if (p === '7d') return [T - 6*DAY, T + DAY, '7 ngày qua (' + fD(T - 6*DAY) + ' – ' + fDY(T) + ')'];
  if (p === 'lastmonth'){ const s = new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime(), e = new Date(d.getFullYear(), d.getMonth(), 1).getTime(); return [s, e, 'Tháng ' + (new Date(s).getMonth() + 1) + '/' + new Date(s).getFullYear()]; }
  if (p === 'custom' && ui.repFrom && ui.repTo){ const s = sod(new Date(ui.repFrom + 'T00:00').getTime()), e = sod(new Date(ui.repTo + 'T00:00').getTime()) + DAY; if (e > s) return [s, e, fDY(s) + ' – ' + fDY(e - DAY)]; }
  const s = new Date(d.getFullYear(), d.getMonth(), 1).getTime(), e = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
  return [s, e, 'Tháng ' + (d.getMonth() + 1) + '/' + d.getFullYear()];
}
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
function vReport(){
  const hs = housesWith('tien'); if (!hs.length) return vNone();
  const [s, e, label] = repRange(), ids = new Set(hs.map(h => h.id)), multi = hs.length > 1;
  const bs = S.bookings.filter(b => ids.has(b.houseId) && b.kind !== 'khoa');
  // Doanh thu chia đều cho từng đêm khách ở (ở 3 đêm thì mỗi đêm 1/3 tiền phòng), ghi vào ngày có khách.
  // Thuê theo giờ: tính hết vào ngày nhận phòng. Tính khách đã trả và khách đang ở; chưa tính lượt chưa đến.
  const allocOf = b => {
    const a = b.aci || b.ci, z = b.status === 'checkedout' ? (b.aco || b.co) : b.co;
    const n = b.kind === 'gio' ? 1 : Math.max(1, Math.round((sod(z) - sod(a)) / DAY));
    const out = []; for (let i = 0; i < n; i++) out.push({ t: sod(sod(a) + i * DAY + 2*HOUR), v: (b.price || 0) / n });
    return out;
  };
  const parts = [];
  bs.filter(b => b.status === 'checkedout' || b.status === 'inhouse').forEach(b => allocOf(b).forEach(p => { if (p.t >= s && p.t < e) parts.push({ b, t: p.t, v: p.v }); }));
  const revenue = parts.reduce((a, p) => a + p.v, 0);
  const stayed = new Set(parts.map(p => p.b.id));
  const cash = new Map(); let cashTotal = 0;
  const addCash = (k, v, t) => { if (t >= s && t < e && v){ cash.set(k, (cash.get(k) || 0) + v); cashTotal += v; } };
  bs.forEach(b => { addCash('Tiền cọc', b.deposit || 0, b.createdAt > (b.co || 0) ? b.ci : b.createdAt); (b.payments || []).forEach(p => addCash(p.method, p.amt, p.at)); });
  const roomsN = hs.reduce((a, h) => a + h.rooms.length, 0);
  let occ = 0; bs.filter(isActive).forEach(b => { const [a, z] = span(b), o = Math.min(z, e) - Math.max(a, s); if (o > 0) occ += o; });
  const occPct = roomsN ? Math.min(100, occ / (roomsN * (e - s)) * 100) : 0;
  const upcoming = bs.filter(b => b.status === 'booked' && b.ci >= s && b.ci < e);
  const debts = bs.filter(b => b.status === 'checkedout' && b.price - paidOf(b) > 0).sort((a, b) => b.aco - a.aco);
  const debtTotal = debts.reduce((a, b) => a + b.price - paidOf(b), 0);
  const roomLbl = b => { const h = H(b.houseId), r = RM(h, b.roomId); return (multi ? h.name + ' · ' : '') + 'P' + (r ? r.name : '?'); };
  const typeLbl = b => { const h = H(b.houseId), r = RM(h, b.roomId); return (multi ? h.name + ' · ' : '') + (r ? typeOf(h, r).name : '?'); };
  const group = fn => { const m = new Map(); parts.forEach(p => { const k = fn(p.b), g = m.get(k) || { ids: new Set(), v:0 }; g.ids.add(p.b.id); g.v += p.v; m.set(k, g); }); return [...m.entries()].map(([k, g]) => [k, { n: g.ids.size, v: g.v }]).sort((a, b) => b[1].v - a[1].v); };
  const table = (title, rows, col = 'Doanh thu') => `<div class="card"><h3 style="margin-bottom:8px">${title}</h3>${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th></th><th class="c">Lượt</th><th style="text-align:right">${col}</th><th style="width:30%">Tỷ lệ</th></tr></thead><tbody>${rows.map(([k, g]) => `<tr><td>${esc(k)}</td><td class="c num">${g.n}</td><td class="num" style="text-align:right">${money(g.v)}</td><td><div class="rbar" style="width:${revenue ? Math.max(2, g.v / revenue * 100) : 0}%"></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Chưa có khách ở trong kỳ này.</div>'}</div>`;
  const days = []; if (e - s <= 62 * DAY) for (let t = s; t < e; t += DAY){ const t2 = sod(t + DAY + 2*HOUR); const ps = parts.filter(p => p.t >= t && p.t < t2); days.push({ t, v: ps.reduce((a, p) => a + p.v, 0), n: ps.length }); t = t2 - DAY; }
  const maxDay = Math.max(1, ...days.map(x => x.v));
  const presets = [['today','Hôm nay'],['7d','7 ngày'],['month','Tháng này'],['lastmonth','Tháng trước'],['custom','Tùy chọn']];
  return `<div class="sec-head"><h2>Báo cáo doanh thu</h2><span class="muted small">${esc(label)}${multi ? ' · ' + hs.length + ' nhà' : ' · ' + esc(hs[0].name)}</span></div>
  <div class="cal-tools"><div class="seg">${presets.map(([k, n]) => `<button data-act="repP" data-p="${k}" class="${(ui.repP || 'month') === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    ${ui.repP === 'custom' ? `<label class="row small muted" style="gap:6px">Từ <input type="date" data-chg="repFrom" value="${esc(ui.repFrom || ymd(s))}"></label><label class="row small muted" style="gap:6px">đến <input type="date" data-chg="repTo" value="${esc(ui.repTo || ymd(e - DAY))}"></label>` : ''}</div>
  <div class="tiles">
    <div class="tile"><b>${money(revenue)}</b><span>Doanh thu phòng (chia theo đêm ở)</span></div>
    <div class="tile"><b>${money(cashTotal)}</b><span>Tiền đã thu trong kỳ</span></div>
    <div class="tile"><b>${stayed.size}</b><span>Lượt khách có ở trong kỳ</span></div>
    <div class="tile"><b>${parts.length}</b><span>Đêm phòng có khách</span></div>
    <div class="tile"><b>${parts.length ? money(Math.round(revenue / parts.length)) : '—'}</b><span>Trung bình mỗi đêm phòng</span></div>
    <div class="tile"><b>${occPct.toFixed(0)}%</b><span>Công suất phòng (${roomsN} phòng)</span></div>
    <div class="tile ${debtTotal ? 'warn' : ''}"><b>${money(debtTotal)}</b><span>Còn phải thu (${debts.length} lượt)</span></div>
  </div>
  <p class="muted small" style="margin:0 0 12px">Doanh thu tính theo những ngày có khách ở: tiền phòng chia đều cho số đêm, ví dụ ở 3 đêm thì mỗi đêm tính 1/3. Thuê theo giờ tính vào ngày nhận phòng. Tính cả khách đang ở. Tiền đã thu tính theo ngày ghi nhận tiền cọc và các lần thu.${upcoming.length ? ` Trong kỳ còn ${upcoming.length} lượt đã đặt chưa đến, trị giá ${money(upcoming.reduce((a, b) => a + b.price, 0))}, chưa tính vào doanh thu.` : ''}</p>
  ${days.length ? `<div class="card" style="margin-bottom:14px"><h3 style="margin-bottom:8px">Theo ngày</h3><div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th class="c">Phòng có khách</th><th style="text-align:right">Doanh thu</th><th style="width:45%"></th></tr></thead><tbody>${days.map(x => `<tr${sod(Date.now()) === x.t ? ' style="background:var(--accent-soft)"' : ''}><td class="num">${WD[new Date(x.t).getDay()]} ${fD(x.t)}</td><td class="c num">${x.n || ''}</td><td class="num" style="text-align:right">${x.v ? money(x.v) : '<span class="muted">—</span>'}</td><td><div class="rbar" style="width:${x.v ? Math.max(2, x.v / maxDay * 100) : 0}%"></div></td></tr>`).join('')}</tbody></table></div></div>` : ''}
  <div class="cols" style="margin-bottom:14px">
    <div class="card"><h3 style="margin-bottom:8px">Tiền đã thu theo cách trả</h3>${cash.size ? `<div class="money">${[...cash.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span>${esc(k)}</span><span class="${v < 0 ? 'red' : ''}">${money(v)}</span>`).join('')}<span class="tot">Tổng</span><span class="tot">${money(cashTotal)}</span></div>` : '<div class="empty">Chưa thu tiền trong kỳ này.</div>'}</div>
    ${table('Theo nguồn đặt', group(b => b.source || 'Khác'))}
    ${table('Theo loại phòng', group(typeLbl))}
    ${table('Theo kiểu thuê', group(b => BKIND[b.kind] || b.kind))}
  </div>
  ${table('Theo phòng', group(roomLbl))}
  <div class="sec-head"><h2>Còn phải thu</h2><span class="muted small">khách đã trả phòng nhưng chưa thu đủ, mọi thời điểm</span></div>
  <div class="card"><div class="list">${debts.slice(0, 50).map(b => `<div class="li click" data-act="openBk" data-id="${b.id}"><div class="when" style="font-size:14px;min-width:96px">${fDT(b.aco)}</div><span class="rtag">${esc(RM(H(b.houseId), b.roomId)?.name || '?')}</span><div class="main"><b>${esc(guestName(b))}</b><span class="small muted">${multi ? esc(hName(b.houseId)) + ' · ' : ''}tiền phòng ${money(b.price)} · đã thu ${money(paidOf(b))}</span></div><b class="red num">${money(b.price - paidOf(b))}</b></div>`).join('') || '<div class="empty">Không có khoản nào còn nợ.</div>'}</div></div>`;
}
const VIEWS = { today: vToday, cal: vCal, hk: vHK, report: vReport, houses: vHouses, users: vUsers, settings: vSettings, log: vLog, none: vNone };

/* ====== hộp thoại ====== */
let modalState = null;
function openModal(html, opts = {}){ $('#modal').innerHTML = `<div class="modal-back" data-act="modalBack"><div class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#modal [autofocus]') || $('#modal input:not([type=hidden]):not([disabled]), #modal select'); if (f && !opts.nofocus) setTimeout(() => { try { f.focus(); } catch(e){} }, 30); }
function closeModal(){ $('#modal').innerHTML = ''; modalState = null; }
const mHead = t => `<div class="modal-h"><h2 class="grow">${t}</h2><button class="btn ghost sm" type="button" data-act="close" aria-label="Đóng">✕</button></div>`;
function confirmBox({ title, html, ok = 'Đồng ý', danger = false, typeText = '' }){
  return new Promise(res => {
    modalState = { confirmRes: res, typeText };
    openModal(`<form data-form="confirm">${mHead(esc(title))}<div class="modal-b">${html}${typeText ? `<label class="f">Gõ đúng “${esc(typeText)}” để xác nhận<input id="cf-text" autocomplete="off" autofocus></label><div class="err hidden" id="cf-err"></div>` : ''}</div><div class="modal-f"><button class="btn" type="button" data-act="confirmNo">Thôi</button><button class="btn ${danger ? 'danger solid' : 'primary'}" type="submit">${esc(ok)}</button></div></form>`);
  });
}
function errBox(id, msg){ const e = $('#' + id); if (!e) return toast(msg, true); e.innerHTML = msg; e.classList.remove('hidden'); }

/* ---- đặt phòng ---- */
function openBookingForm({ houseId, roomId, ci, bookingId, at, kindIn }){
  const b = bookingId ? S.bookings.find(x => x.id === bookingId) : null;
  let hs = housesWith('datphong', b ? 'sua' : 'them');
  if (b) hs = [H(b.houseId)];
  if (!hs.length) return toast('Bạn không có quyền đặt phòng ở nhà này.', true);
  const h = H(houseId || (b && b.houseId)) || hs[0];
  const now = Date.now();
  const kind = b ? b.kind : (kindIn || (ui.view === 'cal' && ui.calDays === 1 && !ui.calFull ? 'gio' : 'dem'));
  let ci0 = b ? b.ci : (at || ci || (sod(now) === sod(atTime(now, h.ci)) && now < atTime(now, h.ci) ? atTime(now, h.ci) : r10(now + 10*MIN)));
  let co0 = b ? b.co : kind === 'gio' ? ci0 + 2*HOUR : atTime(ci0 + DAY, h.co);
  if (!b && kind === 'dem' && ci && !at) { ci0 = atTime(ci, h.ci); co0 = atTime(ci + DAY, h.co); }
  if (!b && kind === 'quadem' && !at) { ci0 = atTime(ci || ci0, h.onIn); co0 = atTime((ci || ci0) + DAY, h.onOut); }
  modalState = { form:'booking', houseId: h.id, bookingId: b ? b.id : null, priceTouched: !!b, sel: new Set(b ? [b.roomId] : roomId ? [roomId] : []) };
  const showGuest = can(h.id, 'khach', b ? 'sua' : 'them') || can(h.id, 'khach');
  const showMoney = can(h.id, 'tien');
  const inh = b && b.status === 'inhouse', done = b && b.status === 'checkedout';
  openModal(`<form data-form="booking">${mHead(!b ? 'Đặt phòng mới' : done ? 'Sửa lượt đã trả phòng' : 'Sửa lượt đặt')}
   <div class="modal-b">
     ${!b && hs.length > 1 ? `<label class="f">Nhà<select id="f-house" data-chg="fHouse">${hs.map(x => `<option value="${x.id}"${x.id === h.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>` : `<div class="muted small">${esc(h.name)}</div>`}
     <label class="f">Kiểu thuê<select id="f-kind" data-chg="fKind">${['dem','gio','quadem'].map(k => `<option value="${k}"${kind === k ? ' selected' : ''}>${BKIND[k]}</option>`).join('')}</select></label>
     <div class="f"><span>${inh || done ? 'Thời gian đã đặt' : 'Nhận phòng → Trả phòng'}</span>
       <button type="button" class="rangebtn" id="f-range" data-act="rangeOpen" ${done ? 'disabled' : ''}></button>
       <input type="hidden" id="f-ci" value="${toInput(ci0)}" ${inh || done ? 'disabled' : ''}><input type="hidden" id="f-co" value="${toInput(co0)}" ${done ? 'disabled' : ''}>
     </div>
     <div id="rp" class="rp hidden"></div>
     ${inh || done ? `<div class="grid2"><label class="f">Giờ nhận thực tế (khách đến sớm/trễ thì sửa ở đây)<input type="datetime-local" id="f-aci" data-chg="fTime" value="${toInput(b.aci)}" required></label>${done ? `<label class="f">Giờ trả thực tế<input type="datetime-local" id="f-aco" data-chg="fTime" value="${toInput(b.aco)}" required></label>` : `<div class="note">Khách ở thêm: sửa “Giờ trả phòng” ở trên hoặc bấm “Gia hạn”.</div>`}</div><div class="small muted" id="f-diff"></div>` : ''}
     <div class="f" style="gap:6px"><span class="small muted" style="font-weight:500">${b ? 'Phòng' : 'Chọn phòng (chọn nhiều phòng để đặt cho đoàn)'}</span><div class="checks" id="f-rooms"></div></div>
     ${showGuest ? `<div class="grid2"><label class="f">Tên khách<input id="f-name" maxlength="60" value="${esc(b ? b.guest.name : '')}" ${b && !can(h.id, 'khach', 'sua') ? 'disabled' : ''}></label><label class="f">Số điện thoại<input id="f-phone" inputmode="tel" maxlength="20" value="${esc(b ? b.guest.phone : '')}" ${b && !can(h.id, 'khach', 'sua') ? 'disabled' : ''}></label></div>` : ''}
     <div class="grid3">
       <label class="f">Người lớn<input type="number" id="f-adults" min="1" max="20" value="${b ? b.guest.adults : 2}"></label>
       <label class="f">Trẻ em<input type="number" id="f-children" min="0" max="20" value="${b ? b.guest.children : 0}"></label>
     </div>
     <div class="f"><span>Nguồn đặt</span><div class="srcpick">${SOURCES.map(s => `<label class="srcopt"><input type="radio" name="f-source" value="${s}" ${(b ? b.source : 'Trực tiếp') === s ? 'checked' : ''}>${srcBadge(s)}<span>${s}</span></label>`).join('')}</div></div>
     <label class="f">Mã đặt phòng của OTA (nếu có, nhập tay)<input id="f-ota" maxlength="40" value="${esc(b ? b.otaCode : '')}"></label>
     ${showMoney ? `<div class="grid2"><label class="f">Giá mỗi phòng (đồng)<input type="number" id="f-price" min="0" step="1000" data-inp="fPrice" value="${b ? b.price : ''}" placeholder="Nhập tiền phòng" ${b && !can(h.id, 'tien', 'sua') ? 'disabled' : ''}></label><label class="f">Tiền cọc mỗi phòng<input type="number" id="f-deposit" min="0" step="1000" value="${b ? b.deposit : 0}" ${b && !can(h.id, 'tien', 'sua') ? 'disabled' : ''}></label></div><div class="small muted" id="f-hint"></div>` : ''}
     ${!b ? `<div id="f-past" class="note hidden"><b>Lượt này đã qua</b>: sẽ lưu thẳng là <b>Đã trả phòng</b> và tính vào doanh thu ngày trả.
       ${can(h.id, 'tien', 'them') ? `<div class="row" style="margin-top:6px"><label class="row"><input type="checkbox" id="f-paid" checked> Khách đã trả đủ tiền</label><select id="f-paymethod" style="min-height:32px;padding:3px 8px">${METHODS.map(m => `<option>${m}</option>`).join('')}</select></div>` : ''}</div>` : ''}
     <label class="f">Ghi chú<textarea id="f-note" maxlength="300">${esc(b ? b.note : '')}</textarea></label>
     <div class="err hidden" id="f-err"></div>
   </div>
   <div class="modal-f"><button class="btn" type="button" data-act="close">Thôi</button><button class="btn primary" type="submit">${b ? 'Lưu thay đổi' : 'Đặt phòng'}</button></div></form>`);
  bookingRefresh();
}
/* ===== Chọn ngày giờ nhận + trả trong cùng một khung lịch ===== */
const tod = t => t - sod(t);
function stayText(ci, co){
  if (!(co > ci)) return 'giờ trả phải sau giờ nhận';
  const n = Math.round((sod(co) - sod(ci)) / DAY);
  return n >= 1 ? n + ' đêm' : dur(co - ci);
}
function rangeLabel(){
  const btn = $('#f-range'); if (!btn) return;
  const ci = fromInput($('#f-ci').value), co = fromInput($('#f-co').value);
  btn.innerHTML = `<span><b>${fT(ci)}</b> ${WD[new Date(ci).getDay()]} ${fD(ci)}</span><span class="muted">→</span><span><b>${fT(co)}</b> ${WD[new Date(co).getDay()]} ${fD(co)}</span><span class="chip">${stayText(ci, co)}</span>`;
}
/* Khung chọn giữ một bản nháp (ms.rp). Chỉ khi bấm "Xong" mới ghi vào đơn và đóng khung.
   Đổi giờ không vẽ lại khung, để bánh xe chọn giờ trên điện thoại không bị nhảy. */
const hmOf = s => { const [a, b] = (s || '00:00').split(':').map(Number); return (a || 0) * HOUR + (b || 0) * MIN; };
function rpInit(){ const ms = modalState; ms.rp = { ci: fromInput($('#f-ci').value), co: fromInput($('#f-co').value) }; ms.rpNext = 'ci'; ms.rpMonth = 0; rpDraw(); }
function rpReadTimes(){
  const ms = modalState, ti = $('#rp-ti'), to = $('#rp-to'); if (!ms || !ms.rp) return;
  if (ti && !ti.disabled && ti.value) ms.rp.ci = sod(ms.rp.ci) + hmOf(ti.value);
  if (to && to.value) ms.rp.co = sod(ms.rp.co) + hmOf(to.value);
}
function rpDraw(){
  const box = $('#rp'), ms = modalState; if (!box || box.classList.contains('hidden') || !ms.rp) return;
  const ci = ms.rp.ci, co = ms.rp.co, lockCi = $('#f-ci').disabled;
  if (!ms.rpMonth){ const d = new Date(lockCi ? co : ci); ms.rpMonth = new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
  const m = new Date(ms.rpMonth), y = m.getFullYear(), mo = m.getMonth(), off = (new Date(y, mo, 1).getDay() + 6) % 7, nDays = new Date(y, mo + 1, 0).getDate();
  const T = sod(Date.now()), sci = sod(ci), sco = sod(co), next = lockCi ? 'co' : (ms.rpNext || 'ci');
  let cells = ['T2','T3','T4','T5','T6','T7','CN'].map(x => `<div class="rp-wd">${x}</div>`).join('') + '<div></div>'.repeat(off);
  for (let d = 1; d <= nDays; d++){
    const t = new Date(y, mo, d).getTime();
    const cls = [t === sci ? 'start' : '', t === sco ? 'end' : '', t > sci && t < sco ? 'in' : '', t === T ? 'today' : '', t < T ? 'past' : ''].join(' ');
    cells += `<button type="button" class="rp-day ${cls}" data-act="rpDay" data-t="${t}">${d}</button>`;
  }
  box.innerHTML = `<div class="rp-head"><button type="button" class="btn sm ghost" data-act="rpMonth" data-d="-1" aria-label="Tháng trước">‹</button><b>Tháng ${mo + 1}/${y}</b><button type="button" class="btn sm ghost" data-act="rpMonth" data-d="1" aria-label="Tháng sau">›</button></div>
    <div class="rp-hint">${lockCi ? 'Khách đã nhận phòng: chỉ chọn lại ngày trả.' : next === 'co' ? 'Bấm chọn <b>ngày trả phòng</b>' : 'Bấm chọn <b>ngày nhận phòng</b>'}</div>
    <div class="rp-grid">${cells}</div>
    <div class="rp-foot"><label class="f">Giờ nhận<input type="time" id="rp-ti" value="${fT(ci)}" ${lockCi ? 'disabled' : ''}></label><label class="f">Giờ trả<input type="time" id="rp-to" value="${fT(co)}"></label></div>
    <div class="rp-hint" style="margin-top:6px;text-align:left">Ngày: ${fD(ci)} → ${fD(co)}. Chỉnh giờ xong bấm <b>Xong</b> để lưu.</div>
    <div class="err hidden" id="rp-err"></div>
    <div class="row" style="margin-top:8px;justify-content:flex-end"><button type="button" class="btn sm" data-act="rpCancel">Thôi</button><button type="button" class="btn primary" data-act="rpDone">Xong</button></div>`;
}
function bookingRefresh(){
  const ms = modalState; if (!ms || ms.form !== 'booking') return;
  rangeLabel();
  const pastBox = $('#f-past'); if (pastBox) pastBox.classList.toggle('hidden', !(fromInput($('#f-co').value) <= Date.now()));
  const h = H(ms.houseId), b = ms.bookingId ? S.bookings.find(x => x.id === ms.bookingId) : null;
  const kind = $('#f-kind').value, f = readTimes(b), ci = f.aci || f.ci, co = f.aco || f.co;
  const box = $('#f-rooms');
  const diff = $('#f-diff');
  if (diff){
    const parts = [];
    if (f.aci < b.ci - 15*MIN) parts.push(`Nhận sớm ${dur(b.ci - f.aci)}`); else if (f.aci > b.ci + 15*MIN) parts.push(`Nhận trễ ${dur(f.aci - b.ci)}`);
    if (f.aco){ if (f.aco > f.co + 15*MIN) parts.push(`Trả muộn ${dur(f.aco - f.co)}`); else if (f.aco < f.co - 15*MIN) parts.push(`Trả sớm ${dur(f.co - f.aco)}`); }
    diff.textContent = parts.length ? parts.join(' · ') + '. Tiền phụ thu (nếu có) bạn tự nhập vào ô tiền phòng.' : '';
  }
  box.innerHTML = h.rooms.map(r => {
    const cand = { id: b ? b.id : 'new', roomId: r.id, houseId: h.id, ci: f.ci, co: f.co, status: b ? b.status : 'booked', aci: f.aci, aco: f.aco };
    const busy = ci < co ? conflicts(cand).length > 0 : false;
    const on = ms.sel.has(r.id);
    return `<label class="${busy && !on ? 'dis' : ''}" title="${busy ? 'Đã có khách trong khoảng giờ này' : ''}"><input type="${b ? 'radio' : 'checkbox'}" name="f-room" value="${r.id}" data-chg="fRoom" ${on ? 'checked' : ''} ${busy && !on ? 'disabled' : ''}>${esc(r.name)}${busy ? ' <span class="small red">bận</span>' : ''}</label>`;
  }).join('');
  const p = $('#f-price');
  if (p){
    const first = [...ms.sel][0] ? RM(h, [...ms.sel][0]) : h.rooms[0];
    const auto = first && co > ci ? priceFor(h, first, kind, ci, co) : 0;
    ms.auto = auto;
    const n = ms.sel.size || 1;
    $('#f-hint').innerHTML = `Tiền phòng do bạn tự nhập, app không tự đổi. Giá tham khảo theo bảng giá: ${money(auto)}${!p.disabled && +p.value !== auto ? ` <button type="button" class="btn sm" data-act="useAutoPrice">Điền giá này</button>` : ''}${n > 1 ? ` · ${n} phòng, tổng ${money((+p.value || 0) * n)}` : ''}`;
  }
}
function readTimes(b){
  const g = id => { const e = $('#' + id); return e ? fromInput(e.value) : null; };
  return { ci: g('f-ci'), co: g('f-co'), aci: $('#f-aci') ? g('f-aci') : (b ? b.aci : null), aco: $('#f-aco') ? g('f-aco') : (b ? b.aco : null) };
}
function saveBooking(){
  // Khung chọn giờ còn mở mà bấm lưu đơn: lấy luôn ngày giờ đang chọn trong khung.
  if (modalState.rp && $('#rp') && !$('#rp').classList.contains('hidden')){ A.rpDone(); if (modalState.rp) return; }
  const ms = modalState, h = H(ms.houseId), now = Date.now();
  const b = ms.bookingId ? S.bookings.find(x => x.id === ms.bookingId) : null;
  if (!can(h.id, 'datphong', b ? 'sua' : 'them')) return errBox('f-err', 'Bạn không có quyền này.');
  const kind = $('#f-kind').value, f = readTimes(b), ci = f.ci, co = f.co;
  const rooms = [...ms.sel];
  if (!rooms.length) return errBox('f-err', 'Hãy chọn ít nhất một phòng.');
  if ([ci, co, f.aci, f.aco].some(t => Number.isNaN(t))) return errBox('f-err', 'Hãy nhập đủ ngày giờ.');
  if (!(co > (f.aci || ci))) return errBox('f-err', 'Giờ trả phòng phải sau giờ nhận phòng.');
  if (f.aco && !(f.aco > f.aci)) return errBox('f-err', 'Giờ trả thực tế phải sau giờ nhận thực tế.');
  if (f.aci && b && b.status === 'inhouse' && f.aci > Date.now() + 5*MIN) return errBox('f-err', 'Giờ nhận thực tế không thể sau thời điểm hiện tại.');
  const clash = [];
  for (const rid of rooms){
    const cand = { id: b ? b.id : 'new', roomId: rid, houseId: h.id, ci, co, status: b ? b.status : 'booked', aci: f.aci, aco: f.aco };
    for (const o of conflicts(cand)) clash.push(`Phòng ${esc(RM(h, rid).name)} trùng với ${o.kind === 'khoa' ? 'khóa phòng' : esc(guestName(o))} (${fDT(span(o)[0])} → ${fDT(span(o)[1])})`);
  }
  if (clash.length) return errBox('f-err', 'Không đặt được vì trùng lịch:<br>' + clash.join('<br>'));
  const v = id => { const e = $('#' + id); return e ? e.value : null; };
  const pl = { id: b ? b.id : '', houseId: h.id, rooms, kind, ci, co, aci: f.aci, aco: f.aco, adults: +v('f-adults') || 1, children: +v('f-children') || 0,
    source: (document.querySelector('input[name="f-source"]:checked') || {}).value || 'Trực tiếp', otaCode: (v('f-ota') || '').trim(), note: (v('f-note') || '').trim() };
  if ($('#f-name') && !$('#f-name').disabled){ pl.guestName = v('f-name').trim(); pl.guestPhone = v('f-phone').trim(); }
  if ($('#f-price') && !$('#f-price').disabled){ pl.price = +v('f-price') || 0; pl.deposit = +v('f-deposit') || 0; }
  const past = !b && co <= Date.now();
  if (past && $('#f-paid')){ pl.paidFull = $('#f-paid').checked; pl.payMethod = $('#f-paymethod').value; }
  const apply = () => {
    const guest = g => ({ ...g, adults: pl.adults, children: pl.children, ...(pl.guestName !== undefined ? { name: pl.guestName, phone: pl.guestPhone } : {}) });
    if (b){
      Object.assign(b, { kind, roomId: rooms[0], source: pl.source, otaCode: pl.otaCode, note: pl.note, guest: guest(b.guest) });
      if (b.status === 'booked') b.ci = ci;
      if (b.status !== 'checkedout') b.co = co;
      if (f.aci) b.aci = f.aci; if (f.aco) b.aco = f.aco;
      if (pl.price !== undefined){ b.price = pl.price; b.deposit = pl.deposit; }
    } else rooms.forEach(rid => S.bookings.push({ id: 'tmp' + uid(), houseId: h.id, roomId: rid, groupId: '', kind, status: past ? 'checkedout' : 'booked', ci, co, aci: past ? ci : null, aco: past ? co : null,
      guest: guest({ name: '', phone: '' }), source: pl.source, otaCode: pl.otaCode, note: pl.note, price: pl.price || 0, deposit: pl.deposit || 0,
      payments: past && pl.paidFull && (pl.price || 0) > (pl.deposit || 0) ? [{ amt: pl.price - (pl.deposit || 0), method: pl.payMethod, at: co, by: me.name }] : [] }));
  };
  call('saveBooking', pl, { apply });
}
function openBlockForm(bookingId){
  const b = bookingId ? S.bookings.find(x => x.id === bookingId) : null;
  const hs = b ? [H(b.houseId)] : housesWith('lich', 'them');
  if (!hs.length) return toast('Bạn không có quyền khóa phòng.', true);
  const now = Date.now();
  modalState = { form:'block', bookingId: b ? b.id : null };
  openModal(`<form data-form="block">${mHead(b ? 'Sửa khóa phòng' : 'Khóa phòng')}
    <div class="modal-b"><p class="muted small" style="margin:0">Phòng bị khóa không đặt được trong khoảng thời gian này. Dùng khi bảo trì hoặc giữ phòng riêng.</p>
    <label class="f">Phòng<select id="k-room" ${b ? 'disabled' : ''}>${hs.map(h => `<optgroup label="${esc(h.name)}">${h.rooms.map(r => `<option value="${h.id}|${r.id}"${b && b.roomId === r.id ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
    <div class="grid2"><label class="f">Từ<input type="datetime-local" id="k-from" value="${toInput(b ? b.ci : r10(now))}" required></label><label class="f">Đến<input type="datetime-local" id="k-to" value="${toInput(b ? b.co : r10(now + DAY))}" required></label></div>
    <label class="f">Lý do<input id="k-note" maxlength="80" value="${esc(b ? b.note : '')}" placeholder="Ví dụ: sơn lại tường"></label>
    ${b ? '' : '<label class="row"><input type="checkbox" id="k-hk" checked> Chuyển trạng thái phòng sang Bảo trì</label>'}
    <div class="err hidden" id="k-err"></div></div>
    <div class="modal-f"><button class="btn" type="button" data-act="close">Thôi</button><button class="btn primary" type="submit">${b ? 'Lưu' : 'Khóa phòng'}</button></div></form>`);
}
function saveBlock(){
  const ms = modalState, b = ms.bookingId ? S.bookings.find(x => x.id === ms.bookingId) : null;
  const [hid, rid] = b ? [b.houseId, b.roomId] : $('#k-room').value.split('|');
  const ci = fromInput($('#k-from').value), co = fromInput($('#k-to').value), h = H(hid), r = RM(h, rid);
  if (!(co > ci)) return errBox('k-err', 'Thời gian “Đến” phải sau “Từ”.');
  const cand = { id: b ? b.id : 'new', roomId: rid, houseId: hid, ci, co, status:'block' };
  const cl = conflicts(cand); if (cl.length) return errBox('k-err', 'Phòng đã có khách trong khoảng này: ' + cl.map(o => esc(guestName(o)) + ' ' + fDT(span(o)[0])).join(', '));
  const note = $('#k-note').value.trim();
  const setHk = !b && $('#k-hk').checked;

function shrinkPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = Math.min(1080, img.naturalWidth), q = 0.8, out = '';
      for (let i = 0; i < 6; i++){
        const c = document.createElement('canvas'); c.width = w; c.height = Math.round(img.naturalHeight * w / img.naturalWidth);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 380000) return res(out);
        w = Math.round(w * 0.8); q = Math.max(0.55, q - 0.07);
      }
      out.length < 400000 ? res(out) : rej(new Error('Ảnh quá lớn.'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh.')); };
    img.src = url;
  });
}

const BANKS = [['Vietcombank','970436','vcb'],['Techcombank','970407','tcb'],['MB Bank','970422','mb mbbank quandoi'],['ACB','970416','acb'],['VPBank','970432','vpb'],['BIDV','970418','bidv'],['VietinBank','970415','ctg vietin'],['Agribank','970405','agri'],['Sacombank','970403','stb sacom'],['TPBank','970423','tpb'],['VIB','970441','vib'],['HDBank','970437','hdb'],['SHB','970443','shb'],['OCB','970448','ocb'],['MSB','970426','msb maritime'],['Eximbank','970431','eib exim'],['SeABank','970440','seab'],['LPBank','970449','lpb lienviet']];
function bankOf(name){
  const n = noAccent(name).toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!n) return null;
  return BANKS.find(([nm, , al]) => n === nm.toLowerCase().replace(/[^a-z0-9]/g, '') || al.split(' ').some(a => n === a || n.startsWith(a) && a.length >= 3 || n.includes(nm.toLowerCase().replace(/[^a-z0-9]/g, '')))) || null;
}
function crc16(s){
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++){ c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function vietqrPayload(bin, acc, amount, content){
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const s = f('00', '01') + f('01', amount ? '12' : '11') + f('38', f('00', 'A000000727') + f('01', f('00', bin) + f('01', acc)) + f('02', 'QRIBFTTA'))
    + f('53', '704') + (amount ? f('54', String(Math.round(amount))) : '') + f('58', 'VN') + (content ? f('62', f('08', content)) : '') + '6304';
  return s + crc16(s);
}

  rows.push({ i:'🕑', l:'Nhận phòng → Trả phòng', v:d.time });
  const TX = P + 104, TW = W - TX - P - 24;
  const meas = rows.map(r => { x.font = r.big ? `700 52px ${SANS}` : r.small ? `500 32px ${SANS}` : `500 36px ${SANS}`; const lines = wrap(r.v, TW); return { r, lines, lh: r.big ? 62 : r.small ? 44 : 48 }; });
  const panelH = meas.reduce((s, m) => s + 70 + m.lines.length * m.lh, 26);
  rr(40, y, W - 80, panelH, 32); x.fillStyle = C.card; x.fill();
  let ry = y + 30;
  meas.forEach((m, k) => {
    x.fillStyle = C.chip; x.beginPath(); x.arc(P + 44, ry + 44, 38, 0, Math.PI * 2); x.fill();
    x.font = `40px ${SANS}`; x.textAlign = 'center'; x.fillStyle = C.ink; x.fillText(m.r.i, P + 44, ry + 22); x.textAlign = 'left';
    x.fillStyle = C.soft; x.font = `500 28px ${SANS}`; x.fillText(m.r.l, TX, ry); ry += 40;
    x.fillStyle = m.r.big ? C.ink : C.ink; x.font = m.r.big ? `700 52px ${SANS}` : m.r.small ? `500 32px ${SANS}` : `500 36px ${SANS}`;
    m.lines.forEach(t => { x.fillText(t, TX, ry); ry += m.lh; });
    ry += 30;
    if (k < meas.length - 1){ x.fillStyle = C.line; x.fillRect(TX, ry - 16, W - TX - 72, 2); }
  });
  y += panelH + 32;
