  if (d.note){
    // "Bật MÁY LẠNH: ..." → phần trước dấu hai chấm làm tiêu đề to, phần sau là cách làm
    const m = /^([^:]{2,40}):\s*(.+)$/s.exec(d.note), head = m ? m[1].trim() : '', body = m ? m[2].trim() : d.note;
    const TW2 = W - 80 - 150, HL = 60, BL = 52;
    x.font = `800 48px ${SANS}`; const hl = head ? wrap(head, TW2) : [];
    x.font = `700 38px ${SANS}`; const nl = wrap(body.charAt(0).toUpperCase() + body.slice(1), TW2);
    const textH = hl.length * HL + (hl.length ? 8 : 0) + nl.length * BL, nh = Math.max(120, textH + 60);
    rr(40, y, W - 80, nh, 32); x.fillStyle = '#FBE1D3'; x.fill();
    x.fillStyle = C.accent; rr(40, y, 14, nh, 7); x.fill();
    x.font = `56px ${SANS}`; x.textAlign = 'center'; x.fillText('❄️', P + 50, y + nh / 2 - 30); x.textAlign = 'left';
    let ty = y + (nh - textH) / 2 + 2;
    x.fillStyle = '#7A2A12'; x.font = `800 48px ${SANS}`; hl.forEach(t => { x.fillText(t, P + 112, ty); ty += HL; });
    if (hl.length) ty += 8;
    x.fillStyle = '#8E3418'; x.font = `700 38px ${SANS}`; nl.forEach(t => { x.fillText(t, P + 112, ty); ty += BL; });
    y += nh + 28;
  }
  {
    const t = '🪪  Gửi giúp home ảnh CCCD nhé';
    x.font = `700 40px ${SANS}`; const tw = x.measureText(t).width, bw = tw + 96, bh = 92;
    rr((W - bw) / 2, y, bw, bh, bh / 2); x.fillStyle = '#E4ECDD'; x.fill();
    x.textAlign = 'center'; x.fillStyle = '#3F5A39'; x.fillText(t, W / 2, y + 24); x.textAlign = 'left';
    y += bh + 32;
  }
  // thanh toán
  if (d.remain > 0){
    const QS = qr ? 320 : 0, payH = qr ? QS + 64 : 200;
    rr(40, y, W - 80, payH, 32); x.fillStyle = C.card; x.fill();
    let px = P + 16;
    if (qr){
      const n = qr.getModuleCount(), cell = Math.floor((QS - 24) / n), size = cell * n, qx = px + (QS - size) / 2, qy = y + 32 + (QS - size) / 2;
      x.fillStyle = '#fff'; rr(px, y + 32, QS, QS, 20); x.fill();
      x.fillStyle = '#1E1A17'; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (qr.isDark(i, j)) x.fillRect(qx + j * cell, qy + i * cell, cell, cell);
      px += QS + 36;
    }
    let py = y + 40; const pw = W - px - 72;
    x.fillStyle = C.soft; x.font = `500 28px ${SANS}`; x.fillText('💳 Còn thanh toán', px, py); py += 42;
    x.fillStyle = C.accent; x.font = `700 58px ${SANS}`; x.fillText(money(d.remain), px, py); py += 80;
    if (d.bank){
      x.fillStyle = C.ink; x.font = `700 34px ${SANS}`; x.fillText(d.bank.acc, px, py); py += 46;
      x.font = `500 28px ${SANS}`; x.fillStyle = C.soft;
      wrap([d.bankName, d.bank.holder].filter(Boolean).join(' · '), pw).slice(0, 2).forEach(t => { x.fillText(t, px, py); py += 38; });
      x.fillText('ND: ' + d.content, px, py);
    }
    y += payH + 32;
  } else if (d.paidAll){ x.fillStyle = C.green; x.font = `600 34px ${SANS}`; x.textAlign = 'center'; x.fillText('✅ Đã thanh toán đủ, cảm ơn mình nhiều!', W / 2, y); x.textAlign = 'left'; y += 70; }
  // lời nhắn cuối
  x.textAlign = 'center';
  y += 6;
  x.fillStyle = C.green; x.font = `italic 500 32px ${SERIF}`; x.fillText(`Chúc ${d.guest} nghỉ ngơi vui vẻ ♡`, W / 2, y); y += 70;
  x.textAlign = 'left';
  const out = document.createElement('canvas'); out.width = W; out.height = y;
  out.getContext('2d').drawImage(cv, 0, 0);
  return out.toDataURL('image/jpeg', 0.9);
}

async function hkOp(op, hid, rid){
  const h = H(hid), r = RM(h, rid), now = Date.now();
  if (op === 'pass' || op === 'fail'){ if (!can(hid, 'kiemtra', 'sua')) return toast('Chỉ người có quyền kiểm tra mới duyệt được.', true); }
  else if (!can(hid, 'donphong', 'sua')) return toast('Bạn không có quyền đổi trạng thái phòng.', true);
  if (op === 'broken' || op === 'note'){
    modalState = { form:'hknote', op, hid, rid };
    return openModal(`<form data-form="hknote">${mHead((op === 'broken' ? 'Báo hỏng phòng ' : 'Ghi chú phòng ') + esc(r.name))}<div class="modal-b"><label class="f">${op === 'broken' ? 'Hỏng gì?' : 'Đồ cần bổ sung, đồ khách để quên…'}<textarea id="hn-text" maxlength="200" autofocus ${op === 'broken' ? 'required' : ''}>${op === 'note' ? esc(r.hkNote) : ''}</textarea></label>${op === 'broken' ? '<div class="note">Phòng sẽ chuyển sang Bảo trì. Muốn chặn đặt phòng trong lúc sửa, dùng “Khóa phòng” trên Lịch.</div>' : ''}</div>
      <div class="modal-f"><button class="btn" type="button" data-act="close">Thôi</button><button class="btn primary" type="submit">Lưu</button></div></form>`);
  }
  // Đổi ngay trên màn hình, máy chủ lưu phía sau. Nếu máy chủ báo lỗi thì tải lại dữ liệu thật.
  if (op === 'clean') Object.assign(r, { hk:'sach', hkBy: me.id, hkDoneAt: now, hkStart: null, hkEnd: null });
  else if (op === 'start') Object.assign(r, { hk:'dangdon', hkBy: me.id, hkStart: now, hkEnd: null, assignee: r.assignee || me.id });
  else if (op === 'done') Object.assign(r, { hk:'chokiem', hkEnd: now });
  else if (op === 'pass') Object.assign(r, { hk:'sach', hkDoneAt: now });
  else if (op === 'fail') Object.assign(r, { hk:'ban', hkStart: null, hkEnd: null });
  else if (op === 'fixed') Object.assign(r, { hk:'ban', hkNote: '' });
  else if (op === 'dirty') r.hk = 'ban';
  else if (op === 'dnd') r.dnd = !r.dnd;
  render();
  call('hk', { houseId: hid, roomId: rid, op }, { optimistic: true });
}

let drag = null, suppressUntil = 0;
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.button !== 0) return;
  const bar = e.target.closest('.bar[data-drag]'); if (!bar) return;
  const b = S.bookings.find(x => x.id === bar.dataset.id); if (!b) return;
  drag = { b, bar, x0: e.clientX, y0: e.clientY, w0: bar.offsetWidth, mode: e.target.classList.contains('bar-grip') ? 'resize' : 'move', moved:false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved){ if (Math.hypot(dx, dy) < 6) return; drag.moved = true; drag.bar.classList.add('dragging'); }
  if (drag.mode === 'move') drag.bar.style.transform = `translate(${drag.b.status === 'inhouse' ? 0 : dx}px,${dy}px)`;
  else drag.bar.style.width = Math.max(8, drag.w0 + dx) + 'px';
  e.preventDefault();
});
document.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.moved) return;
  suppressUntil = Date.now() + 350;
  const b = d.b, h = H(b.houseId), pph = dayWidth(ui.calDays) / 24, dx = e.clientX - d.x0;
  const raw = dx / pph * HOUR, step = !ui.calFull && ui.calDays === 1 ? 30*MIN : DAY, shift = Math.round(raw / step) * step;
  const cand = { ...b };
  if (d.mode === 'move'){
    const under = document.elementFromPoint(e.clientX, e.clientY), track = under && under.closest('.track');
    if (track && track.dataset.house === b.houseId) cand.roomId = track.dataset.room;
    if (b.status !== 'inhouse'){ cand.ci = b.ci + shift; cand.co = b.co + shift; }
  } else { cand.co = b.co + shift; if (cand.co <= (b.aci || b.ci) + 30*MIN){ toast('Giờ trả phải sau giờ nhận.', true); return render(); } }
  if (cand.roomId === b.roomId && cand.ci === b.ci && cand.co === b.co) return render();
  if (!can(h.id, 'lich', 'sua')){ toast('Bạn không có quyền sửa lịch.', true); return render(); }
  const cl = conflicts(cand);
  if (cl.length){ toast(`Không đổi được: trùng lịch với ${cl[0].kind === 'khoa' ? 'khóa phòng' : guestName(cl[0])} (${fDT(span(cl[0])[0])}).`, true); return render(); }
  call('move', { id: b.id, roomId: cand.roomId, ci: cand.ci, co: cand.co }, { apply: () => Object.assign(b, { roomId: cand.roomId, ci: cand.ci, co: cand.co }) });
});

  delUser: async d => { const u = S.users.find(x => x.id === d.id); const ok = await confirmBox({ title:'Xóa tài khoản ' + u.name, html:'<p>Người này sẽ không đăng nhập được nữa. Nhật ký cũ vẫn giữ tên họ.</p>', ok:'Xóa tài khoản', danger:true }); if (!ok) return; call('delUser', { userId: u.id }); },
};
document.addEventListener('click', e => {
  if (Date.now() < suppressUntil) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  if (el.dataset.act !== 'modalBack') e.preventDefault();
  e.stopPropagation();
  f(el.dataset, el, e);
});
const CHG = {
  cdLock: el => { modalState.lock = el.value; drawCodes(); },
  gatePhoto: async el => {
    const f = el.files && el.files[0]; if (!f) return;
    readGateDraft();
    const ms = modalState, d = ms.gDraft, g = d.gates[+el.dataset.gi], hid = ms.hid;
    let data;
    try { data = await shrinkPhoto(f); } catch (e) { return toast(e.message, true); }
    g.photoData = data; drawGateSetup();
    toast('Đang lưu ảnh…');
    call('savePhoto', { houseId: hid, gateId: g.id, data }, { keepOpen: true, apply: () => {}, after: () => {
      const sv = (H(hid).gates || []).find(x => x.id === g.id); if (sv && sv.photo) PHOTOS[sv.photo] = data;
      toast('Đã lưu ảnh nhà.');
    } });
  },
  house: el => { ui.house = el.value; ui.scrollNow = true; render(); },
  floor: el => { ui.floor = el.value; render(); },
  repFrom: el => { ui.repFrom = el.value; render(); },
  repTo: el => { ui.repTo = el.value; render(); },
  showCancel: el => { ui.showCancel = el.checked; render(); },
  logHouse: el => { ui.logHouse = el.value; render(); },
  assign: el => { const r = RM(H(el.dataset.h), el.dataset.r); if (r) r.assignee = el.value; call('assign', { houseId: el.dataset.h, roomId: el.dataset.r, userId: el.value }, { optimistic: true }); },
  fHouse: el => { closeModal(); openBookingForm({ houseId: el.value }); },
  fKind: el => {
    const h = H(modalState.houseId), ci = fromInput($('#f-ci').value), k = el.value;
    if (!$('#f-ci').disabled){
      if (k === 'dem'){ $('#f-ci').value = toInput(atTime(ci, h.ci)); $('#f-co').value = toInput(atTime(ci + DAY, h.co)); }
      if (k === 'gio'){ const s = sod(ci) === sod(Date.now()) ? Math.max(ci, r10(Date.now())) : ci; $('#f-ci').value = toInput(s); $('#f-co').value = toInput(s + 2*HOUR); }
      if (k === 'quadem'){ $('#f-ci').value = toInput(atTime(ci, h.onIn)); $('#f-co').value = toInput(atTime(ci + DAY, h.onOut)); }
    }
    modalState.priceTouched = false; bookingRefresh();
  },
  exCo: () => extendRefresh(),
  ciAt: () => ciDiff(),
  coCalc: () => coCalc(),
  fTime: () => { modalState.priceTouched = modalState.bookingId ? modalState.priceTouched : false; bookingRefresh(); },
  fRoom: el => { if (el.type === 'radio') modalState.sel = new Set([el.value]); else el.checked ? modalState.sel.add(el.value) : modalState.sel.delete(el.value); bookingRefresh(); },
  hCopy: el => { modalState.copyFrom = el.value || null; const src = el.value ? H(el.value) : null; if (src){ ['ci','co'].forEach(k => $('#h-' + k).value = src[k]); $('#h-onin').value = src.onIn; $('#h-onout').value = src.onOut; modalState.types = JSON.parse(JSON.stringify(src.types)); drawTypes(); } },
  permAccess: el => { const ms = modalState; if (el.checked) ms.draft[ms.house] = ROLES.letan.p(); else delete ms.draft[ms.house]; drawPerms(); },
  permCell: el => { const p = modalState.draft[modalState.house]; p[el.dataset.m][el.dataset.a] = el.checked; if (el.dataset.a !== 'xem' && el.checked && p[el.dataset.m].xem === false) p[el.dataset.m].xem = true; if (el.dataset.a === 'xem' && !el.checked) Object.keys(p[el.dataset.m]).forEach(a => p[el.dataset.m][a] = false); drawPerms(); },
};
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
let qTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.inp === 'calQ'){ clearTimeout(qTimer); qTimer = setTimeout(() => { ui.q = el.value; const pos = el.selectionStart; render(); const n = $('#calQ'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(_){} } }, 250); }
  if (el.dataset.inp === 'fPrice') bookingRefresh();
  if (el.dataset.inp === 'coCalc') coCalc();
});
const FORMS = {
  login: () => signIn('login', { username: $('#l-user').value.trim().toLowerCase(), pin: $('#l-pin').value.trim() }, 'l-err'),
  setup: () => {
    const pin = $('#s-pin').value.trim(); if (!/^\d{6}$/.test(pin)) return errBox('s-err', 'Mã PIN phải gồm đúng 6 chữ số.');
    signIn('setup', { code: $('#s-code').value.trim(), name: $('#s-name').value.trim(), username: $('#s-user').value.trim().toLowerCase(), pin }, 's-err');
  },
  confirm: () => {
    const ms = modalState;
    if (ms.typeText && $('#cf-text').value.trim() !== ms.typeText) return errBox('cf-err', 'Tên gõ chưa khớp.');
    const extra = { reason: ($('#cx-reason') || {}).value || '', refund: !!document.querySelector('input[name="cx-dep"][value="refund"]:checked') };
    const r = ms.confirmRes; closeModal(); r(extra);
  },
  booking: () => saveBooking(),
  block: () => saveBlock(),
  checkout: () => doCheckout(),
  checkin: () => saveCheckin(),
  extend: () => saveExtend(),
  pay: () => { const amt = +$('#p-amt').value || 0, method = $('#p-method').value, b = S.bookings.find(x => x.id === modalState.id); if (amt <= 0) return; call('pay', { id: b.id, amt, method }, { apply: () => b.payments.push({ amt, method, at: Date.now(), by: me.name }) }); },
  hknote: () => { const ms = modalState; call('hk', { houseId: ms.hid, roomId: ms.rid, op: ms.op, note: $('#hn-text').value.trim() }); },
  house: () => saveHouse(),
  times: form => {
    const h = H(form.dataset.h); if (!can(h.id, 'caidat', 'sua')) return toast('Bạn không có quyền sửa cài đặt.', true);
    const v = { ci: form.ci.value, co: form.co.value, onIn: form.onIn.value, onOut: form.onOut.value }, all = !!(form.all && form.all.checked);
    call('saveTimes', { houseId: h.id, ...v, all }, { apply: () => (all ? myHouses() : [h]).forEach(x => Object.assign(x, v)) });
  },
  hkset: form => call('saveHkSettings', { prepH: +form.prepH.value, redM: +form.redM.value, autoIn: form.autoIn.checked, autoOut: form.autoOut.checked }),
  rooms: () => saveRooms(),
  user: () => saveUser(),
  perms: () => savePerms(),
  pin: () => { const pin = $('#pn-pin').value.trim(); if (!/^\d{6}$/.test(pin)) return errBox('pn-err', 'Mã PIN phải gồm đúng 6 chữ số.'); call('resetPin', { userId: modalState.id, pin }, { err:'pn-err' }); },
};
document.addEventListener('submit', e => { e.preventDefault(); const f = FORMS[e.target.dataset.form]; if (f) f(e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').childElementCount){ if (modalState && modalState.confirmRes) A.confirmNo(); else closeModal(); } });
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S && me && ui.view === 'cal' && ui.calFull && !drag && !$('#modal').childElementCount) render(); }, 250); });
function applyTheme(){ if (ui.theme) document.documentElement.setAttribute('data-theme', ui.theme); else document.documentElement.removeAttribute('data-theme'); }

/* ====== khởi động ====== */
async function refresh(){
  if (!TOKEN || !S || busy || drag || $('#modal').childElementCount || document.visibilityState !== 'visible' || (document.activeElement && document.activeElement.id === 'calQ')) return;
  const r = await rpc('getData');
  if (r.auth){ signOut(r.err); return; }
  if (r.data && !busy && !drag && !$('#modal').childElementCount){ applyData(r.data); render(); }
}
(async () => {
  let savedUI = null;
  try { savedUI = JSON.parse(localStorage.getItem(UIKEY)); } catch(e){}
  ui = { ...defaultUI(), ...(savedUI || {}), scrollNow: true };
  applyTheme();
  app.innerHTML = '<div class="empty" style="margin-top:20vh">Đang tải dữ liệu…</div>';
  let local = ''; try { local = localStorage.getItem(TOKKEY) || ''; } catch(e){}
  const fromUrl = await urlToken();
  for (const t of [...new Set([local, fromUrl].filter(Boolean))]){
    TOKEN = t;
    const r = await rpc('getData');
    if (r.data){ saveTok(); applyData(r.data); render(); if (ui.view === 'log') loadLogs(); break; }
    TOKEN = '';
  }
  if (!TOKEN) saveTok();
  if (!S){ const st = await rpc('status'); BOOT.needsSetup = !!st.needsSetup; if (st.err) BOOT.err = st.err; render(); if (st.err) toast(st.err, true); }
  setInterval(refresh, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
})();
</script>
